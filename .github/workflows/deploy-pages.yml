name: Deploy unified learning apps to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false   # never cancel a production deployment half way

jobs:
  ci:
    if: github.event.repository.name == 'hero-language-camp'
    uses: ./.github/workflows/ci.yml
    with:
      publish: true
    permissions:
      contents: read

  deploy:
    if: github.event.repository.name == 'hero-language-camp'
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
