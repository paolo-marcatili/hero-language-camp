name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      publish:
        description: Upload the built Pages artifact (set by deploy-pages.yml)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck, lint, format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, lint, format check
        run: npm run ci:typecheck

  test:
    name: Tests and content checks
    needs: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install curriculum compiler dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Install dependencies
        run: npm ci
      - name: Unit, UI and content checks
        run: npm run ci:test

  build:
    name: Release checks and site build
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository (LFS assets are needed here only)
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify release and build the unified site
        run: npm run ci:build
      - name: Upload GitHub Pages artifact
        if: inputs.publish
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  audit:
    name: Dependency audit
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
