title:
  da: Ord- og Talheltene
  it: Gli eroi delle parole e dei numeri
opening:
  da: Bogstaver og tal er blevet spredt ud over kongeriget. I hvert kapitel hjælper helten med at samle dem og bruge dem til at læse, tælle og regne.
  it: Lettere e numeri sono stati dispersi nel regno. In ogni capitolo l’eroe li raccoglie e impara a usarli per leggere, contare e calcolare.
milestones: []
chapters:
  - id: school_0
    minimum_level: 0
    title:
      da: 0. klasse · 1A · Velkommen og lytning
    summary:
      da: Lyt til en kort besked, og fortæl dit navn. Tæl og sammenlign mængder til 3. Sortér efter en udtrykkelig egenskab.
    fiction:
      da: Helten følger stien til velkommen og lytning. Dragen har fundet en ny gåde. Brug det, du lærer, til at åbne den næste port.
    lesson:
      title:
        da: Velkommen og lytning
      objectives:
        - da: Lyt til en kort besked, og fortæl dit navn.
        - da: Tæl og sammenlign mængder til 3.
        - da: Sortér efter en udtrykkelig egenskab.
      explanation:
        da: Læs eller lyt sammen. Lad barnet genfortælle med egne ord og vise sin løsning med ting eller en tegning. Lyt til en kort besked, og fortæl dit navn. Tæl og sammenlign mængder til 3.
      examples:
        - target: Ida har en rød bold. Bo har en blå bil. Ida giver bolden til Bo. De leger sammen.
          translation:
            da: Ida har en rød bold. Bo har en blå bil. Ida giver bolden til Bo. De leger sammen.
    mission:
      da: Læs eller lyt sammen. Lad barnet genfortælle med egne ord og vise sin løsning med ting eller en tegning. Lyt til en kort besked, og fortæl dit navn. Tæl og sammenlign mængder til 3.
