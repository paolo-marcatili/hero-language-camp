title:
  en: "The Spark Path"
opening:
  en: "Each chapter mixes a short adventure with a clear Armenian lesson. Reopen earlier chapters whenever you want to review."
milestones: []
chapters:
  - id: "chapter_stage_0"
    minimum_level: 0
    title:
      en: "Chapter 0 · The first sparks"
    summary:
      en: "Meet the first letters and use a few essential one-word messages."
    fiction:
      en: "A tiny spark lands in the hero’s hand and draws Armenian letters in the air. Each recognised sign lights a stone on the first path."
    story_beats:
      - en: "Beyond the gate, someone has erased every name from a stone bridge."
    lesson:
      title:
        en: "Letters and one-word messages"
      objectives:
        - en: "Recognise the first group of Armenian letters."
        - en: "Use hello, yes, no and thank you."
      explanation:
        en: "Armenian uses its own alphabet. At first, connect each shape with its Armenian name and sound instead of trying to learn the whole alphabet at once. A single Armenian word can also be a complete message."
      examples:
        - target: "Բարև։"
          transliteration: "barev"
          translation:
            en: "Hello!"
        - target: "Շնորհակալություն։"
          transliteration: "shnorhakalutyun"
          translation:
            en: "Thank you."
        - target: "Այո։ / Ոչ։"
          transliteration: "ayo / voch"
          translation:
            en: "Yes. / No."
      dialogue: []
      study_notes:
        - en: "Keep the name of a letter separate from the sound it represents."
        - en: "Use the alphabet atlas to revisit letters already introduced."
      common_mistakes:
        - en: "Do not assume an Armenian letter sounds like a Latin letter just because its shape looks familiar."
    mission:
      en: "Light the first runes with greetings and letter recognition."
    cliffhanger:
      en: "Beyond the gate, someone has erased every name from a stone bridge."
  - id: "chapter_stage_1"
    minimum_level: 1
    title:
      en: "Chapter 1 · The guardian of names"
    summary:
      en: "Introduce yourself, ask a name and notice simple forms of “to be”."
    fiction:
      en: "A guardian has forgotten every name. The bridge opens only for travellers who can say who they are and ask another person’s name."
    story_beats:
      - en: "The recovered name opens a house full of photographs with missing labels."
    lesson:
      title:
        en: "Introducing yourself"
      objectives:
        - en: "Say your name."
        - en: "Ask another person’s name."
        - en: "Notice եմ, ես and է in short sentences."
      explanation:
        en: "In short Armenian identity sentences, a form of “to be” often comes near the end. English usually prefers “I am Ani” or “My name is Ani” rather than copying Armenian word order."
      examples:
        - target: "Ես Անի եմ։"
          transliteration: "yes Ani em"
          translation:
            en: "I am Ani."
        - target: "Ի՞նչ է քո անունը։"
          transliteration: "inch e qo anuny"
          translation:
            en: "What is your name?"
        - target: "Իմ անունը Անի է։"
          transliteration: "im anuny Ani e"
          translation:
            en: "My name is Ani."
          note:
            en: "A closer word-for-word rendering is “My name is Ani.”"
      dialogue: []
      study_notes:
        - en: "Learn the Armenian sentence as a chunk before translating word by word."
        - en: "Change only the name when practising the pattern."
      common_mistakes:
        - en: "Do not treat every Armenian word-order variation as a different English meaning."
    mission:
      en: "Tell the guardian your name and learn theirs."
    cliffhanger:
      en: "The recovered name opens a house full of photographs with missing labels."
  - id: "chapter_stage_2"
    minimum_level: 2
    title:
      en: "Chapter 2 · The house of photographs"
    summary:
      en: "Talk about family, point to people and things, and express possession."
    fiction:
      en: "Moonlit photographs have lost their labels. The hero restores each memory by identifying the people in it."
    story_beats:
      - en: "The last photograph shows a banquet table with every plate mysteriously empty."
    lesson:
      title:
        en: "This is… and possession"
      objectives:
        - en: "Introduce a nearby person or object."
        - en: "Use իմ for “my”."
        - en: "Make a simple description."
      explanation:
        en: "Սա introduces a nearby person or thing. Իմ means “my” and does not change for grammatical gender the way words do in some European languages."
      examples:
        - target: "Սա իմ մայրն է։"
          transliteration: "sa im mayrn e"
          translation:
            en: "This is my mother."
        - target: "Սա իմ հայրն է։"
          transliteration: "sa im hayrn e"
          translation:
            en: "This is my father."
        - target: "Մեր տունը մեծ է։"
          transliteration: "mer tuny mets e"
          translation:
            en: "Our house is big."
      dialogue: []
      study_notes:
        - en: "English needs a natural article where appropriate; Armenian structure does not map word for word."
        - en: "Notice that իմ stays the same with different nouns."
      common_mistakes:
        - en: "Do not add a gender distinction to Armenian իմ."
    mission:
      en: "Relabel the photographs and introduce the family."
    cliffhanger:
      en: "The last photograph shows a banquet table with every plate mysteriously empty."
  - id: "chapter_stage_3"
    minimum_level: 3
    title:
      en: "Chapter 3 · The silent banquet"
    summary:
      en: "Say that you are hungry or thirsty and make polite requests."
    fiction:
      en: "Food appears in an enchanted dining hall only when somebody makes a clear request."
    story_beats:
      - en: "A book-shaped key points toward a school that moves every morning."
    lesson:
      title:
        en: "Needs and polite requests"
      objectives:
        - en: "Say that you are hungry or thirsty."
        - en: "Use ուզում եմ to say what you want."
        - en: "Add a polite request."
      explanation:
        en: "Ուզում եմ is a useful “I want” chunk. Armenian and English use articles differently, so choose natural English such as “some water” or “some bread” rather than translating mechanically."
      examples:
        - target: "Ես ջուր եմ ուզում։"
          transliteration: "yes jur em uzum"
          translation:
            en: "I want some water."
        - target: "Ես սոված եմ։"
          transliteration: "yes sovats em"
          translation:
            en: "I am hungry."
        - target: "Խնդրում եմ։"
          transliteration: "khndrum em"
          translation:
            en: "Please."
      dialogue: []
      study_notes:
        - en: "Practise ուզում եմ as one reusable block."
        - en: "Translate the meaning naturally instead of matching every Armenian word with one English word."
      common_mistakes:
        - en: "A grammatically possible alternative word order must never be used as the only “wrong” answer."
    mission:
      en: "Make the banquet appear by asking clearly and politely."
    cliffhanger:
      en: "A book-shaped key points toward a school that moves every morning."
  - id: "chapter_stage_4"
    minimum_level: 4
    title:
      en: "Chapter 4 · The moving school"
    summary:
      en: "Use everyday actions and ask for help during a lesson."
    fiction:
      en: "The school changes position every morning. It slows down when the hero describes what they are doing and asks for repetition when something is unclear."
    story_beats:
      - en: "Behind the board appears a map whose landmarks keep drifting."
    lesson:
      title:
        en: "Actions and classroom language"
      objectives:
        - en: "Talk about reading and other current actions."
        - en: "Say when you do not understand."
        - en: "Ask somebody to repeat."
      explanation:
        en: "Armenian present-tense forms can correspond to English simple or continuous forms depending on context. In these lessons we choose the natural English interpretation for the situation."
      examples:
        - target: "Ես գիրք եմ կարդում։"
          transliteration: "yes girk em kardum"
          translation:
            en: "I am reading a book."
        - target: "Չեմ հասկանում։"
          transliteration: "chem haskanum"
          translation:
            en: "I don’t understand."
        - target: "Կրկնիր, խնդրում եմ։"
          transliteration: "krknir, khndrum em"
          translation:
            en: "Please repeat that."
      dialogue: []
      study_notes:
        - en: "Use classroom phrases as complete chunks."
        - en: "Listen for the negative form in Չեմ հասկանում։"
      common_mistakes:
        - en: "Do not force one English tense mechanically onto every Armenian present-tense sentence."
    mission:
      en: "Stop the moving school by describing actions and asking for help."
    cliffhanger:
      en: "Behind the board appears a map whose landmarks keep drifting."
  - id: "chapter_stage_5"
    minimum_level: 5
    title:
      en: "Chapter 5 · The map in the mist"
    summary:
      en: "Ask where something is and distinguish here from there."
    fiction:
      en: "A map appears only in patches. Asking the right location question reveals the next landmark."
    story_beats:
      - en: "At the end of the map, clouds form the hands of a giant clock."
    lesson:
      title:
        en: "Places and location questions"
      objectives:
        - en: "Ask where a place is."
        - en: "Understand nearby, here and there."
        - en: "Use a short destination question."
      explanation:
        en: "English usually needs an article in “Where is the school?” even though Armenian packages the idea differently. Learn the whole Armenian question pattern."
      examples:
        - target: "Որտե՞ղ է դպրոցը։"
          transliteration: "vortegh e dprotsy"
          translation:
            en: "Where is the school?"
        - target: "Այգին այնտեղ է։"
          transliteration: "aygin ayntegh e"
          translation:
            en: "The park is over there."
        - target: "Ո՞ւր ես գնում։"
          transliteration: "ur es gnum"
          translation:
            en: "Where are you going?"
      dialogue: []
      study_notes:
        - en: "Keep “where is…?” and “where are you going?” as separate question patterns."
        - en: "Use landmarks from the game to practise."
      common_mistakes:
        - en: "Do not accept two answer choices that express the same location meaning with only harmless English word-order changes."
    mission:
      en: "Reveal the route through the mist."
    cliffhanger:
      en: "At the end of the map, clouds form the hands of a giant clock."
  - id: "chapter_stage_6"
    minimum_level: 6
    title:
      en: "Chapter 6 · The cloud clock"
    summary:
      en: "Use numbers, age, today, tomorrow and simple weather language."
    fiction:
      en: "A clock made of clouds will not move until the hero counts correctly and places events in time."
    story_beats:
      - en: "The clock chimes summon several shadowy voices speaking together."
    lesson:
      title:
        en: "Numbers and time"
      objectives:
        - en: "Say how old you are."
        - en: "Count small groups."
        - en: "Talk about today, tomorrow and weather."
      explanation:
        en: "Armenian expresses age differently from English. Translate Քանի՞ տարեկան ես։ naturally as “How old are you?” and Ես ութ տարեկան եմ։ as “I am eight years old.”"
      examples:
        - target: "Քանի՞ տարեկան ես։"
          transliteration: "kani tarekan es"
          translation:
            en: "How old are you?"
        - target: "Ես ութ տարեկան եմ։"
          transliteration: "yes ut tarekan em"
          translation:
            en: "I am eight years old."
        - target: "այսօր անձրև է գալիս"
          transliteration: "aysor andzrev e galis"
          translation:
            en: "It is raining today."
      dialogue: []
      study_notes:
        - en: "Treat age expressions as meaning-based phrases, not literal word substitutions."
        - en: "Notice the time word first: այսօր is today and վաղը is tomorrow."
      common_mistakes:
        - en: "Do not use the Italian-style age construction in English; English uses “I am … years old.”"
    mission:
      en: "Set the cloud clock moving again."
    cliffhanger:
      en: "The clock chimes summon several shadowy voices speaking together."
  - id: "chapter_stage_7"
    minimum_level: 7
    title:
      en: "Chapter 7 · The chorus of shadows"
    summary:
      en: "Use we/they forms and simple negation."
    fiction:
      en: "Several shadows speak at once. The hero has to hear whether they mean “we”, “they”, or a negative action."
    story_beats:
      - en: "When the shadows clear, all the earlier paths join into one final road."
    lesson:
      title:
        en: "We, they and negation"
      objectives:
        - en: "Recognise we and they."
        - en: "Use plural forms of “to be”."
        - en: "Understand a simple negative action."
      explanation:
        en: "English pronouns are normally stated explicitly, so Նրանք տանն են։ should be presented as “They are at home,” not the ambiguous Italian-style “are at home.”"
      examples:
        - target: "Մենք ընկերներ ենք։"
          transliteration: "menk ynkerner enk"
          translation:
            en: "We are friends."
        - target: "Նրանք տանն են։"
          transliteration: "nrank tann en"
          translation:
            en: "They are at home."
        - target: "Մենք չենք գնում։"
          transliteration: "menk chenk gnum"
          translation:
            en: "We are not going."
      dialogue: []
      study_notes:
        - en: "Listen for the plural verb ending as well as the pronoun."
        - en: "Contrast Մենք and Նրանք aloud."
      common_mistakes:
        - en: "Never offer an English translation that hides a subject distinction the Armenian sentence explicitly makes."
    mission:
      en: "Separate the voices and identify who is speaking."
    cliffhanger:
      en: "When the shadows clear, all the earlier paths join into one final road."
  - id: "chapter_stage_8"
    minimum_level: 8
    title:
      en: "Chapter 8 · The path of voices"
    summary:
      en: "Combine familiar phrases into short dialogues."
    fiction:
      en: "The final path echoes with greetings, introductions, places and school language from every previous chapter."
    story_beats:
      - en: "The road remains open for the next chapter of the course."
    lesson:
      title:
        en: "Putting the pieces together"
      objectives:
        - en: "Follow a short dialogue."
        - en: "Combine known sentence patterns."
        - en: "Use context rather than translating one word at a time."
      explanation:
        en: "At this stage, focus on meaning across a whole exchange. English and Armenian do not need to share the same word order for the translation to be correct."
      examples:
        - target: "Բարև, ես Անի եմ։ Իսկ դու՞։"
          transliteration: "barev, yes Ani em. isk du?"
          translation:
            en: "Hello, I’m Ani. And you?"
        - target: "Այսօր մենք դպրոց ենք գնում։"
          transliteration: "aysor menk dprots enk gnum"
          translation:
            en: "Today we are going to school."
      dialogue: []
      study_notes:
        - en: "Revisit earlier chapters when a pattern feels uncertain."
        - en: "Use the story dialogue to practise several known chunks together."
      common_mistakes:
        - en: "Do not mark a natural equivalent translation wrong merely because its English word order differs."
    mission:
      en: "Follow the combined path using everything learned so far."
    cliffhanger:
      en: "The road remains open for the next chapter of the course."
  - id: "chapter_stage_9"
    minimum_level: 9
    title:
      en: "Chapter 9 · The language border"
    summary:
      en: "Talk about countries, languages, and origin without translating word for word."
    fiction:
      en: "The path of voices reaches a border marked by glowing flags. The keeper asks for no documents: the gate opens when each traveller can say where they are from and which language they are learning."
    story_beats:
      - en: "The flags change colour whenever the hero confuses a country with a language. To steady them, the hero must listen to the whole question and choose an answer with the same meaning."
    lesson:
      title:
        en: "Origin and languages"
      objectives:
        - en: "Ask where someone is from."
        - en: "Say which country you are from."
        - en: "Talk about languages you study or speak."
      explanation:
        en: "To say “I am from…”, Armenian often uses a country form ending in -ից. Learn complete patterns such as Ես Իտալիայից եմ rather than assembling each word separately. Questions are also marked by intonation."
      examples:
        - target: "Որտեղի՞ց ես։"
          transliteration: "vorteghits es"
          translation:
            en: "Where are you from?"
        - target: "Ես Իտալիայից եմ։"
          transliteration: "yes Italiayits em"
          translation:
            en: "I am from Italy."
        - target: "Ես հայերեն եմ սովորում։"
          transliteration: "yes hayeren em sovorum"
          translation:
            en: "I am learning Armenian."
      dialogue:
        - speaker:
            en: "Keeper"
          target: "Որտեղի՞ց ես։"
          transliteration: "vorteghits es"
          translation:
            en: "Where are you from?"
        - speaker:
            en: "Hero"
          target: "Ես Իտալիայից եմ։ Ես հայերեն եմ սովորում։"
          transliteration: "yes Italiayits em. yes hayeren em sovorum"
          translation:
            en: "I am from Italy. I am learning Armenian."
      study_notes:
        - en: "Keep country, language, and person distinct: Հայաստան, հայերեն, and հայ are not interchangeable."
        - en: "Practise the question and answer as a pair, then change only the country."
      common_mistakes:
        - en: "Do not use a naturally reordered Armenian sentence as the only wrong answer."
    mission:
      en: "Rebuild the language map by introducing three travellers."
    cliffhanger:
      en: "Beyond the border lies a city whose streets move whenever someone gives an unclear direction."
  - id: "chapter_stage_10"
    minimum_level: 10
    title:
      en: "Chapter 10 · The city that changes its streets"
    summary:
      en: "Ask where a place is and follow short directions."
    fiction:
      en: "In the moving city, bridges and squares change position with every answer. The hero must ask precisely and follow one direction at a time to reach the central tower."
    story_beats:
      - en: "A magic map shows only three symbols: the destination, a landmark, and the next direction."
    lesson:
      title:
        en: "Places and directions"
      objectives:
        - en: "Ask where a place is."
        - en: "Understand near and far."
        - en: "Follow right, left, and straight ahead."
      explanation:
        en: "Location questions and directions use different patterns: Կայարանը որտե՞ղ է asks for a location, while Գնա ուղիղ gives a command. Learn them as functional chunks and use one landmark at a time."
      examples:
        - target: "Կայարանը որտե՞ղ է։"
          transliteration: "kayarany vortegh e"
          translation:
            en: "Where is the station?"
        - target: "Գնա ուղիղ։"
          transliteration: "gna ughigh"
          translation:
            en: "Go straight."
        - target: "Կամուրջը փողոցի մոտ է։"
          transliteration: "kamurjy poghotsi mot e"
          translation:
            en: "The bridge is near the street."
      dialogue:
        - speaker:
            en: "Traveller"
          target: "Կայարանը որտե՞ղ է։"
          transliteration: "kayarany vortegh e"
          translation:
            en: "Where is the station?"
        - speaker:
            en: "Mapmaker"
          target: "Գնա ուղիղ, հետո՝ աջ։"
          transliteration: "gna ughigh, heto aj"
          translation:
            en: "Go straight, then turn right."
      study_notes:
        - en: "Draw a small map and say one direction for each section."
        - en: "Contrast մոտ and հեռու using the same two places."
      common_mistakes:
        - en: "Do not confuse a “where?” question with a “go…” command just because both use place words."
    mission:
      en: "Carry the map to the tower by following four correct directions."
    cliffhanger:
      en: "The tower has no stairs: its doors open only at the right time."
  - id: "chapter_stage_11"
    minimum_level: 11
    title:
      en: "Chapter 11 · The tower of hours"
    summary:
      en: "Talk about days, times, and daily routines."
    fiction:
      en: "Each floor of the tower belongs to a different time of day. To climb, the hero must connect the day, the time, and an action without confusing duration with clock time."
    story_beats:
      - en: "The hands slow down when a sentence contains unnecessary information. The clearest answer is usually short."
    lesson:
      title:
        en: "Days, clock time, and routines"
      objectives:
        - en: "Say what day it is."
        - en: "Tell a whole-hour time."
        - en: "Describe a habitual morning or evening action."
      explanation:
        en: "Ժամը երեքն է means “It is three o'clock,” while երեք ժամ means “three hours.” Word order and grammatical forms distinguish clock time from duration. Then connect a time to a routine using words such as առավոտ and երեկո."
      examples:
        - target: "Այսօր երկուշաբթի է։"
          transliteration: "aysor yerkushabti e"
          translation:
            en: "Today is Monday."
        - target: "Ժամը երեքն է։"
          transliteration: "zhamy yerekn e"
          translation:
            en: "It is three o'clock."
        - target: "Ես առավոտյան շուտ եմ արթնանում։"
          transliteration: "yes aravotyan shut em artnanum"
          translation:
            en: "I wake up early in the morning."
      dialogue:
        - speaker:
            en: "Clockmaker"
          target: "Դասը ժամը իննին է։"
          transliteration: "dasy zhamy innin e"
          translation:
            en: "The lesson is at nine."
        - speaker:
            en: "Hero"
          target: "Ես առավոտյան շուտ եմ արթնանում։"
          transliteration: "yes aravotyan shut em artnanum"
          translation:
            en: "I wake up early in the morning."
      study_notes:
        - en: "Use a real or drawn clock while practising the sentences."
        - en: "Contrast today, tomorrow, and yesterday with the same activity."
      common_mistakes:
        - en: "Do not choose “three hours” when the question asks for the time."
    mission:
      en: "Put the tower's day in order and reach the final door."
    cliffhanger:
      en: "Behind the door is a classroom where books respond only to clearly spoken instructions."
  - id: "chapter_stage_12"
    minimum_level: 12
    title:
      en: "Chapter 12 · The ink classroom"
    summary:
      en: "Understand common instructions and use classroom vocabulary."
    fiction:
      en: "In the ink classroom, notebooks and pencils move by themselves. The hero must distinguish the object from the action and follow the exact instruction before the words disappear."
    story_beats:
      - en: "Each correct command leaves a readable line on the board; a different command produces a different result, not merely a different word order."
    lesson:
      title:
        en: "Classroom instructions"
      objectives:
        - en: "Recognise key classroom objects."
        - en: "Understand short commands such as open, write, and listen."
        - en: "Say that you have a question."
      explanation:
        en: "In instructions, the verb form directly tells you what to do. Learn verb and object together: Բացիր գիրքը, Գրիր անունդ, Լսիր ուսուցչին. Changing the verb or the object genuinely changes the meaning."
      examples:
        - target: "Բացիր գիրքը։"
          transliteration: "batsir girky"
          translation:
            en: "Open the book."
        - target: "Գրիր անունդ։"
          transliteration: "grir anund"
          translation:
            en: "Write your name."
        - target: "Ես հարց ունեմ։"
          transliteration: "yes harts unem"
          translation:
            en: "I have a question."
      dialogue:
        - speaker:
            en: "Teacher"
          target: "Լսիր ուսուցչին։"
          transliteration: "lsir usutsichin"
          translation:
            en: "Listen to the teacher."
        - speaker:
            en: "Hero"
          target: "Ես հարց ունեմ։"
          transliteration: "yes harts unem"
          translation:
            en: "I have a question."
      study_notes:
        - en: "Act out each command with a book, notebook, and pencil."
        - en: "Change one element at a time: first the verb, then the object."
      common_mistakes:
        - en: "Do not treat “open the book” and “read the book” as equivalent: they describe different actions."
    mission:
      en: "Complete the ink lesson by following five different instructions."
    cliffhanger:
      en: "A coloured page flies out of the classroom and leads to a market where every object changes shade."
  - id: "chapter_stage_13"
    minimum_level: 13
    title:
      en: "Chapter 13 · The market of colours"
    summary:
      en: "Describe clothes and colours and talk about simple preferences."
    fiction:
      en: "At the market of colours, objects change whenever they are described imprecisely. To buy the right fabric, the hero must name both the item and its colour."
    story_beats:
      - en: "The merchant shows very similar pairs: only the colour, garment, or person changes. Every alternative therefore has a distinct, checkable meaning."
    lesson:
      title:
        en: "Descriptions with colours and clothes"
      objectives:
        - en: "Name common colours."
        - en: "Describe an item of clothing."
        - en: "Ask which colour someone likes."
      explanation:
        en: "In the pattern studied here, an Armenian colour adjective normally comes before the noun: կարմիր շապիկ. In plural sentences, also notice the final form of “to be.” Translate naturally without inventing gender distinctions that Armenian does not express in the same way."
      examples:
        - target: "Սա կարմիր շապիկ է։"
          transliteration: "sa karmir shapik e"
          translation:
            en: "This is a red shirt."
        - target: "Անիի կոշիկները սև են։"
          transliteration: "Anii koshiknery sev en"
          translation:
            en: "Ani's shoes are black."
        - target: "Ի՞նչ գույն ես սիրում։"
          transliteration: "inch guyn es sirum"
          translation:
            en: "What colour do you like?"
      dialogue:
        - speaker:
            en: "Merchant"
          target: "Ի՞նչ գույն ես սիրում։"
          transliteration: "inch guyn es sirum"
          translation:
            en: "What colour do you like?"
        - speaker:
            en: "Hero"
          target: "Ես կապույտ գույն եմ սիրում։"
          transliteration: "yes kapuyt guyn em sirum"
          translation:
            en: "I like blue."
      study_notes:
        - en: "Match each colour with two different objects so you do not memorise only one pair."
        - en: "Contrast singular and plural using շապիկ and կոշիկներ."
      common_mistakes:
        - en: "Do not offer two options that describe the same object with merely another natural word order."
    mission:
      en: "Find four objects in the requested colours and complete the merchant's cloak."
    cliffhanger:
      en: "The market mirror reflects a tired face and opens a passage to the hall of well-being."
  - id: "chapter_stage_14"
    minimum_level: 14
    title:
      en: "Chapter 14 · The mirror of well-being"
    summary:
      en: "Talk about the body, feelings, and simple health problems."
    fiction:
      en: "The magic mirror shows not appearance but how the viewer feels. The hero must distinguish a body part, an emotion, and a negative form to help the people in the hall."
    story_beats:
      - en: "Each character says one short sentence. Changing the person, body part, or negation creates a different situation."
    lesson:
      title:
        en: "How do you feel?"
      objectives:
        - en: "Say which body part hurts."
        - en: "Say that you are tired, happy, or sad."
        - en: "Say that you do not feel well."
      explanation:
        en: "Expressions such as Գլուխս ցավում է are best learned as complete phrases. The ending on գլուխ marks “my head,” while չեմ forms the first-person negative in Ես լավ չեմ զգում. Focus on the communicative meaning before analysing every morpheme."
      examples:
        - target: "Գլուխս ցավում է։"
          transliteration: "glukhs tsavum e"
          translation:
            en: "My head hurts."
        - target: "Ես հոգնած եմ։"
          transliteration: "yes hognats em"
          translation:
            en: "I am tired."
        - target: "Ես լավ չեմ զգում։"
          transliteration: "yes lav chem zgum"
          translation:
            en: "I do not feel well."
      dialogue:
        - speaker:
            en: "Healer"
          target: "Ինչպե՞ս ես քեզ զգում։"
          transliteration: "inchpes es kez zgum"
          translation:
            en: "How do you feel?"
        - speaker:
            en: "Hero"
          target: "Ես հոգնած եմ, բայց գլուխս չի ցավում։"
          transliteration: "yes hognats em, bayts glukhs chi tsavum"
          translation:
            en: "I am tired, but my head does not hurt."
      study_notes:
        - en: "Act out the feeling or point to the body part while saying the sentence."
        - en: "Contrast a positive sentence with its genuine negative form."
      common_mistakes:
        - en: "Do not confuse “I am tired” with “he or she is tired”: the grammatical person changes."
    mission:
      en: "Help four characters describe how they feel accurately."
    cliffhanger:
      en: "Behind the mirror appears a house full of doors, but only one key is in the right place."
  - id: "chapter_stage_15"
    minimum_level: 15
    title:
      en: "Chapter 15 · The house of keys"
    summary:
      en: "Describe rooms and positions using on, under, and in."
    fiction:
      en: "The house of keys rearranges itself whenever a position is described incorrectly. To escape, the hero must say precisely which object is on, under, or inside another."
    story_beats:
      - en: "Each room contains the same few objects in different positions, so the meaning truly depends on the location word."
    lesson:
      title:
        en: "Rooms and object location"
      objectives:
        - en: "Name several rooms in a home."
        - en: "Say what is open or closed."
        - en: "Use վրա, տակ, and մեջ in simple sentences."
      explanation:
        en: "In location sentences, the landmark often takes a form such as սեղանի, “of the table.” At first, learn the whole structure Բանալին սեղանի վրա է and replace only one element at a time."
      examples:
        - target: "Սա իմ սենյակն է։"
          transliteration: "sa im senyakn e"
          translation:
            en: "This is my room."
        - target: "Բանալին սեղանի վրա է։"
          transliteration: "banalin seghani vra e"
          translation:
            en: "The key is on the table."
        - target: "Պայուսակը աթոռի տակ է։"
          transliteration: "payusaky atori tak e"
          translation:
            en: "The bag is under the chair."
      dialogue:
        - speaker:
            en: "House"
          target: "Բանալին որտե՞ղ է։"
          transliteration: "banalin vortegh e"
          translation:
            en: "Where is the key?"
        - speaker:
            en: "Hero"
          target: "Բանալին սեղանի վրա է։"
          transliteration: "banalin seghani vra e"
          translation:
            en: "The key is on the table."
      study_notes:
        - en: "Move a real key, book, and bag and describe each new position."
        - en: "Keep the same object and change only վրա, տակ, or մեջ."
      common_mistakes:
        - en: "Do not treat “on the table” and “under the table” as equivalent: the spatial relationship is the point of the sentence."
    mission:
      en: "Find the key by describing five locations correctly."
    cliffhanger:
      en: "The final door leads to a square full of questions: every voice wants to know who, what, where, when, or why."
  - id: "chapter_stage_16"
    minimum_level: 16
    title:
      en: "Chapter 16 · The square of questions"
    summary:
      en: "Ask useful questions, use negation, and connect short exchanges."
    fiction:
      en: "In the square, questions float like lanterns. The hero must identify the missing information and answer with a short but complete sentence, then recognise when an action is negated."
    story_beats:
      - en: "The lanterns group by function: what, where, when, why, and who. A correct question opens only an answer of the matching type."
    lesson:
      title:
        en: "Questions, negation, and exchanges"
      objectives:
        - en: "Distinguish questions about things, place, time, and people."
        - en: "Recognise a plural negative sentence."
        - en: "Connect a question and answer in a short exchange."
      explanation:
        en: "Question words are not interchangeable: Ի՞նչ asks “what,” Որտե՞ղ “where,” Ե՞րբ “when,” and Ո՞վ “who.” In plural forms, compare նրանք … են with նրանք … չեն to hear the negation."
      examples:
        - target: "Ի՞նչ ես կարդում։"
          transliteration: "inch es kardum"
          translation:
            en: "What are you reading?"
        - target: "Ե՞րբ ես տուն գնում։"
          transliteration: "yerb es tun gnum"
          translation:
            en: "When are you going home?"
        - target: "Նրանք հիմա չեն խաղում։"
          transliteration: "nrank hima chen khaghum"
          translation:
            en: "They are not playing now."
      dialogue:
        - speaker:
            en: "Voice"
          target: "Ի՞նչ ես կարդում։"
          transliteration: "inch es kardum"
          translation:
            en: "What are you reading?"
        - speaker:
            en: "Hero"
          target: "Ես հայերեն գիրք եմ կարդում։"
          transliteration: "yes hayeren girk em kardum"
          translation:
            en: "I am reading an Armenian book."
      study_notes:
        - en: "Match each question word to the kind of answer it requires."
        - en: "Turn a positive plural sentence into its genuine negative form."
      common_mistakes:
        - en: "Do not accept an answer that is grammatical but answers a different question."
    mission:
      en: "Light every lantern by building four question-and-answer pairs."
    cliffhanger:
      en: "The square opens a new road towards longer stories, past experiences, and future plans: the next course section can be added without changing the game engine."
  - id: "chapter_stage_17"
    minimum_level: 17
    title:
      en: "Chapter 17 · The market of scales"
    summary:
      en: "Ask about prices and quantities, then choose without confusing number, weight, and cost."
    fiction:
      en: "The road from the square of questions leads to a market where scales speak and price tags change their numbers. The passage opens only when the hero makes a complete request and checks what is being bought."
    story_beats:
      - en: "A coin copies every price that is said incorrectly. To expose it, the hero must distinguish how much an item costs from how much of it is wanted."
    lesson:
      title:
        en: "Prices, quantities, and requests"
      objectives:
        - en: "Ask how much something costs."
        - en: "State a quantity or weight."
        - en: "Ask to try or buy an item."
      explanation:
        en: "For shopping, learn complete chunks: Որքա՞ն արժե սա, մեկ կիլոգրամ… եմ ուզում, and Կարո՞ղ եմ…։ The number comes before the quantity, while դրամ expresses the price."
      examples:
        - target: "Որքա՞ն արժե սա։"
          transliteration: "vork'an arzhe sa"
          translation:
            en: "How much is this?"
        - target: "Սա երկու հազար դրամ արժե։"
          transliteration: "sa yerku hazar dram arzhe"
          translation:
            en: "This costs two thousand drams."
        - target: "Ես մեկ կիլոգրամ խնձոր եմ ուզում։"
          transliteration: "yes mek kilogram khndzor em uzum"
          translation:
            en: "I would like one kilogram of apples."
      dialogue:
        - speaker:
            en: "Shop assistant"
          target: "Ի՞նչ եք ուզում։"
          transliteration: "inch ek uzum"
          translation:
            en: "What would you like?"
        - speaker:
            en: "Hero"
          target: "Ես մեկ կիլոգրամ խնձոր եմ ուզում։ Որքա՞ն արժե։"
          transliteration: "yes mek kilogram khndzor em uzum. vork'an arzhe"
          translation:
            en: "I would like one kilogram of apples. How much is it?"
      study_notes:
        - en: "Practise the quantity and noun together: մեկ կիլոգրամ խնձոր."
        - en: "Keep գին, դրամ, and կիլոգրամ separate: price, currency, and weight have different roles."
      common_mistakes:
        - en: "Do not treat “how much” and “how many” as the same question."
    mission:
      en: "Buy three items in different quantities and discover which coin is falsifying the price tags."
    cliffhanger:
      en: "Behind the market, a kitchen lights up where every order is repeated by a mischievous echo."
  - id: "chapter_stage_18"
    minimum_level: 18
    title:
      en: "Chapter 18 · The kitchen of echoes"
    summary:
      en: "Order food and drinks with short but complete requests, including preferences such as “without sugar”."
    fiction:
      en: "In the kitchen of echoes, every unnecessary word multiplies and every missing word empties the plate. The hero must order precisely, then recognise the right moment to ask for the bill."
    story_beats:
      - en: "The Menu Wizard changes the dishes whenever “with” and “without” are confused. A clear request keeps the correct plate on the table."
    lesson:
      title:
        en: "Ordering and stating preferences"
      objectives:
        - en: "Ask for the menu and the bill."
        - en: "Order a dish or drink."
        - en: "Say that you want something without an ingredient."
      explanation:
        en: "Café requests can be very short: Ճաշացանկը, խնդրում եմ and Հաշիվը, խնդրում եմ. To exclude something, use առանց followed by the noun form required by the phrase, as in առանց շաքարի."
      examples:
        - target: "Ճաշացանկը, խնդրում եմ։"
          transliteration: "chashatsanky khndrum em"
          translation:
            en: "The menu, please."
        - target: "Մի բաժակ թեյ առանց շաքարի, խնդրում եմ։"
          transliteration: "mi bazhak tey arants shakari khndrum em"
          translation:
            en: "A cup of tea without sugar, please."
        - target: "Հաշիվը, խնդրում եմ։"
          transliteration: "hashivy khndrum em"
          translation:
            en: "The bill, please."
      dialogue:
        - speaker:
            en: "Server"
          target: "Ի՞նչ եք պատվիրում։"
          transliteration: "inch ek patvirum"
          translation:
            en: "What would you like to order?"
        - speaker:
            en: "Hero"
          target: "Ես ապուր և աղցան եմ ուզում։ Մի բաժակ ջուր էլ, խնդրում եմ։"
          transliteration: "yes apur yev aghtsan em uzum. mi bazhak jur el khndrum em"
          translation:
            en: "I would like soup and a salad. A glass of water as well, please."
      study_notes:
        - en: "Learn the container and drink together: մի բաժակ թեյ."
        - en: "Use խնդրում եմ to make a short request polite."
      common_mistakes:
        - en: "Do not confuse հաշիվ “bill/account” with հարց “question”."
    mission:
      en: "Prepare a complete order for two travellers and ask for the bill without making the dishes change."
    cliffhanger:
      en: "Steam from the kitchen rises towards a tower showing four seasons at the same time."
  - id: "chapter_stage_19"
    minimum_level: 19
    title:
      en: "Chapter 19 · The tower of seasons"
    summary:
      en: "Describe simple conditions and connect sun, rain, snow, and temperature with the correct season."
    fiction:
      en: "The tower of seasons turns too quickly: it snows on one side, the sun shines on another, and a wind at the top moves the words around. The hero must observe the sky and choose a sentence that truly describes it."
    story_beats:
      - en: "The Storm Bat hides the season behind a temporary condition. The hero learns to distinguish “it is cold today” from “it snows in winter”."
    lesson:
      title:
        en: "Today’s weather and the seasons"
      objectives:
        - en: "Describe warm and cold weather."
        - en: "Recognise rain, snow, wind, and sun."
        - en: "Say what normally happens in a season."
      explanation:
        en: "Many weather sentences have no personal subject: Անձրև է գալիս and Ձյուն է գալիս. To talk about a season, the noun can take a form such as ձմռանը or ամռանը, meaning “in winter” and “in summer”."
      examples:
        - target: "Այսօր ցուրտ է։"
          transliteration: "aysor tsurt e"
          translation:
            en: "It is cold today."
        - target: "Անձրև է գալիս։"
          transliteration: "andzrev e galis"
          translation:
            en: "It is raining."
        - target: "Ձմռանը ձյուն է գալիս։"
          transliteration: "dzmrrany dzyun e galis"
          translation:
            en: "It snows in winter."
      dialogue:
        - speaker:
            en: "Keeper"
          target: "Այսօր եղանակն ինչպե՞ս է։"
          transliteration: "aysor yeghanakn inchpes e"
          translation:
            en: "What is the weather like today?"
        - speaker:
            en: "Hero"
          target: "Այսօր ցուրտ է և քամի կա։"
          transliteration: "aysor tsurt e yev kami ka"
          translation:
            en: "It is cold and windy today."
      study_notes:
        - en: "Listen to the difference between արև and անձրև: one syllable changes the meaning."
        - en: "Connect each season with more than one sentence, not just one word."
      common_mistakes:
        - en: "Do not always translate “it is” with a separate weather verb: Այսօր ցուրտ է is complete."
    mission:
      en: "Slow the tower by describing the weather on each side and choosing the matching season."
    cliffhanger:
      en: "When the tower stops, a station appears whose tracks change destination every minute."
  - id: "chapter_stage_20"
    minimum_level: 20
    title:
      en: "Chapter 20 · The station of moving tracks"
    summary:
      en: "Use tickets, times, departures, and arrivals to complete a short journey."
    fiction:
      en: "At the station of moving tracks, the signs show a different city whenever a question is incomplete. The hero must buy the correct ticket, listen to the time, and understand whether transport is leaving or arriving."
    story_beats:
      - en: "The Ticket Troll collects answers with no destination. A sentence with a precise city, time, or means of transport puts the track back in place."
    lesson:
      title:
        en: "Tickets, departures, and arrivals"
      objectives:
        - en: "Ask for a ticket to a destination."
        - en: "Say what time you leave."
        - en: "Ask when a train or bus arrives."
      explanation:
        en: "For transport, learn the pair մեկնել “depart” and հասնել “arrive”. In a short request, Մեկ տոմս Երևան, խնդրում եմ is enough; in questions, ե՞րբ asks for a precise time."
      examples:
        - target: "Մեկ տոմս Երևան, խնդրում եմ։"
          transliteration: "mek toms Yerevan khndrum em"
          translation:
            en: "One ticket to Yerevan, please."
        - target: "Մենք ժամը վեցին ենք մեկնում։"
          transliteration: "menk zhamy vetsin enk meknum"
          translation:
            en: "We leave at six."
        - target: "Գնացքը ե՞րբ է հասնում։"
          transliteration: "gnatsky yerb e hasnum"
          translation:
            en: "When does the train arrive?"
      dialogue:
        - speaker:
            en: "Ticket clerk"
          target: "Ո՞ւր եք գնում։"
          transliteration: "ur ek gnum"
          translation:
            en: "Where are you going?"
        - speaker:
            en: "Hero"
          target: "Երևան։ Մեկ տոմս, խնդրում եմ։ Գնացքը ե՞րբ է մեկնում։"
          transliteration: "Yerevan. mek toms khndrum em. gnatsky yerb e meknum"
          translation:
            en: "To Yerevan. One ticket, please. When does the train leave?"
      study_notes:
        - en: "Practise the transport and verb together: գնացքը մեկնում է, գնացքը հասնում է."
        - en: "Check whether the question asks where, when, or how much."
      common_mistakes:
        - en: "Do not confuse մեկնել with գնալ: both can express movement, but մեկնել emphasises departure."
    mission:
      en: "Take three travellers to the correct destination using different tickets and times."
    cliffhanger:
      en: "The train enters a gallery whose walls show only events that have already happened."
  - id: "chapter_stage_21"
    minimum_level: 21
    title:
      en: "Chapter 21 · The gallery of yesterday"
    summary:
      en: "Talk about completed actions using frequent past forms in short sentences."
    fiction:
      en: "In the gallery of yesterday, every picture shows a completed action but loses its verb whenever someone tells it in the present. The hero must recognise what has already happened and complete the memory with the right form."
    story_beats:
      - en: "The Memory Blob mixes yesterday, today, and tomorrow. To separate the images, the hero looks for time signals and listens to the end of the verb."
    lesson:
      title:
        en: "Completed actions in the past"
      objectives:
        - en: "Say where you went yesterday."
        - en: "Talk about a visit or weekend activity."
        - en: "Distinguish a past form from present and future forms."
      explanation:
        en: "This level introduces several frequent simple-past forms: գնացի, դիտեցի, պատրաստեց, and այցելեցինք. Learn them in complete sentences and connect them with signals such as երեկ and շաբաթ օրը."
      examples:
        - target: "Երեկ ես դպրոց գնացի։"
          transliteration: "yerek yes dprots gnatsi"
          translation:
            en: "I went to school yesterday."
        - target: "Ես երեկ ֆիլմ դիտեցի։"
          transliteration: "yes yerek film ditetsi"
          translation:
            en: "I watched a film yesterday."
        - target: "Նա ճաշ պատրաստեց։"
          transliteration: "na chash patrastets"
          translation:
            en: "He or she prepared the meal."
      dialogue:
        - speaker:
            en: "Keeper"
          target: "Ի՞նչ արեցիր երեկ։"
          transliteration: "inch aretsir yerek"
          translation:
            en: "What did you do yesterday?"
        - speaker:
            en: "Hero"
          target: "Ես տատիկին այցելեցի և ֆիլմ դիտեցի։"
          transliteration: "yes tatikin aytseletsi yev film ditetsi"
          translation:
            en: "I visited Grandma and watched a film."
      study_notes:
        - en: "Look for the time marker first, then the verb form."
        - en: "Practise one action in three times: գնում եմ, գնացի, գնալու եմ."
      common_mistakes:
        - en: "Do not accept a present-tense sentence merely because it describes the same action."
    mission:
      en: "Reconstruct four memories by ordering them by day and choosing the correct past verb."
    cliffhanger:
      en: "The final picture becomes a door showing appointments and journeys that have not happened yet."
  - id: "chapter_stage_22"
    minimum_level: 22
    title:
      en: "Chapter 22 · The bridge of tomorrow"
    summary:
      en: "Talk about future plans using concrete times, people, and destinations."
    fiction:
      en: "The bridge of tomorrow builds a plank only when a plan is expressed clearly. Vague ideas fall into the mist; plans with a time, place, and action become a stable path."
    story_beats:
      - en: "The Tomorrow Dragon blows the auxiliary out of future sentences. The hero must keep the -լու form together with the correct form of “to be”."
    lesson:
      title:
        en: "Plans, appointments, and intentions"
      objectives:
        - en: "Say where you are going tomorrow."
        - en: "Arrange a meeting at a precise time."
        - en: "Say that you will call or travel later."
      explanation:
        en: "A common way to express a plan uses the verb in -լու plus եմ, ես, է, ենք, եք, or են: գնալու եմ, հանդիպելու ենք. In a negative sentence, negation attaches to the auxiliary: չեմ գնալու."
      examples:
        - target: "Վաղը ես գրադարան եմ գնալու։"
          transliteration: "vaghy yes gradaran em gnalu"
          translation:
            en: "I am going to the library tomorrow."
        - target: "Մենք ժամը հինգին ենք հանդիպելու։"
          transliteration: "menk zhamy hingin enk handipelu"
          translation:
            en: "We are meeting at five."
        - target: "Ես քեզ երեկոյան զանգահարելու եմ։"
          transliteration: "yes kez yerekoyan zangaharelu em"
          translation:
            en: "I will call you this evening."
      dialogue:
        - speaker:
            en: "Traveller"
          target: "Վաղը ի՞նչ ես անելու։"
          transliteration: "vaghy inch es anelu"
          translation:
            en: "What are you going to do tomorrow?"
        - speaker:
            en: "Hero"
          target: "Առավոտյան գրադարան եմ գնալու, իսկ երեկոյան քեզ զանգահարելու եմ։"
          transliteration: "aravotyan gradaran em gnalu isk yerekoyan kez zangaharelu em"
          translation:
            en: "I am going to the library in the morning, and I will call you in the evening."
      study_notes:
        - en: "Connect the plan with a marker such as վաղը, երեկոյան, or ամռանը."
        - en: "Check that the auxiliary agrees with the person."
      common_mistakes:
        - en: "Do not leave the -լու form on its own: գնալու without an auxiliary does not complete this construction."
    mission:
      en: "Complete the bridge by describing four future plans with different people and times."
    cliffhanger:
      en: "On the other side, a hall of mirrors magnifies every difference between people and objects."
  - id: "chapter_stage_23"
    minimum_level: 23
    title:
      en: "Chapter 23 · The hall of comparisons"
    summary:
      en: "Compare two things without losing either the comparison point or the quality being observed."
    fiction:
      en: "In the hall of comparisons, the mirrors make a bag enormous, a train extremely slow, and a book seem easy. The hero must ignore the illusion and form a comparison that names both things."
    story_beats:
      - en: "The Scale Ogre steals the suffix -ից and the word քան. Without a comparison point, every description remains incomplete."
    lesson:
      title:
        en: "Comparing people and objects"
      objectives:
        - en: "Say that one person is taller than another."
        - en: "Compare speed, weight, or difficulty."
        - en: "Use ավելի … քան in a complete sentence."
      explanation:
        en: "Armenian can compare by putting -ից on the second item, as in Նարեկից բարձր, or by using ավելի … քան. Do not treat the structures as isolated words; learn the whole comparison."
      examples:
        - target: "Արամը Նարեկից բարձր է։"
          transliteration: "Aramy Narekits bardzr e"
          translation:
            en: "Aram is taller than Narek."
        - target: "Գնացքն ավտոբուսից արագ է։"
          transliteration: "gnatskn avtobusits arag e"
          translation:
            en: "The train is faster than the bus."
        - target: "Այս գիրքն ավելի հետաքրքիր է, քան այն գիրքը։"
          transliteration: "ays girkn aveli hetakirkir e kan ayn girky"
          translation:
            en: "This book is more interesting than that book."
      dialogue:
        - speaker:
            en: "Ogre"
          target: "Ո՞ր պայուսակն է թեթև։"
          transliteration: "vor payusakn e tetev"
          translation:
            en: "Which bag is light?"
        - speaker:
            en: "Hero"
          target: "Կապույտ պայուսակը կարմիրից թեթև է։"
          transliteration: "kapuyt payusaky karmirits tetev e"
          translation:
            en: "The blue bag is lighter than the red one."
      study_notes:
        - en: "Identify the two items and the quality before choosing an answer."
        - en: "Compare one property at a time."
      common_mistakes:
        - en: "“More” is not enough by itself: the sentence must say more what, and compared with what."
    mission:
      en: "Disable the mirrors by completing comparisons about height, speed, weight, and interest."
    cliffhanger:
      en: "Behind the final mirror, a beacon flashes as it receives incomplete messages from across the valley."
  - id: "chapter_stage_24"
    minimum_level: 24
    title:
      en: "Chapter 24 · The beacon of messages"
    summary:
      en: "Ask for help, report a delay, and communicate an address or small problem."
    fiction:
      en: "The beacon of messages receives requests with no address, delays with no duration, and problems with no object. The hero must turn each fragment into a useful sentence that another person can actually follow."
    story_beats:
      - en: "The Signal Imp deletes the most important part of every message. To defeat it, the hero must work out whether a person, object, place, or time is missing."
    lesson:
      title:
        en: "Help, messages, and small problems"
      objectives:
        - en: "Ask for help directly and politely."
        - en: "Say that you cannot find or have lost something."
        - en: "Communicate an address or a delay."
      explanation:
        en: "A useful message contains the information the other person needs: Ուղարկիր ինձ հասցեն, Ես տասը րոպե ուշանում եմ. With կարող ես, you can turn a request into a polite question."
      examples:
        - target: "Կարո՞ղ ես ինձ օգնել։"
          transliteration: "karogh es indz ognel"
          translation:
            en: "Can you help me?"
        - target: "Ուղարկիր ինձ հասցեն, խնդրում եմ։"
          transliteration: "ugharkir indz hastsen khndrum em"
          translation:
            en: "Send me the address, please."
        - target: "Ես տասը րոպե ուշանում եմ։"
          transliteration: "yes tas rope ushanum em"
          translation:
            en: "I am ten minutes late."
      dialogue:
        - speaker:
            en: "Friend"
          target: "Որտե՞ղ ես։"
          transliteration: "vortegh es"
          translation:
            en: "Where are you?"
        - speaker:
            en: "Hero"
          target: "Ես տասը րոպե ուշանում եմ։ Ուղարկիր ինձ հասցեն, խնդրում եմ։"
          transliteration: "yes tas rope ushanum em. ugharkir indz hastsen khndrum em"
          translation:
            en: "I am ten minutes late. Send me the address, please."
      study_notes:
        - en: "Before sending a sentence, ask whether the reader knows what to do."
        - en: "Keep գտնել “find” separate from կորցնել “lose”."
      common_mistakes:
        - en: "Do not use a vague message such as “I am late” when the exercise also asks by how much."
    mission:
      en: "Repair the beacon by completing four messages: a request for help, a lost item, an address, and a delay."
    cliffhanger:
      en: "The beacon lights a road towards longer stories, notices, experiences, and multi-turn conversations: the next module can extend the course without changing the engine."
