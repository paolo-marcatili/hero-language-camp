title:
  it: Il Sentiero delle Scintille
  en: The Spark Path
opening:
  it: Ogni capitolo unisce una piccola avventura a una lezione chiara. Puoi riaprire in qualsiasi momento i capitoli già scoperti.
  en: Ogni capitolo unisce una piccola avventura a una lezione chiara. Puoi riaprire in qualsiasi momento i capitoli già scoperti.
milestones: []
chapters:
  - id: chapter_stage_0
    minimum_level: 0
    title:
      it: Capitolo 0 · Le prime scintille
      en: Chapter 0 · The first sparks
    summary:
      it: Riconosci le prime lettere e usa saluti brevi ma utili.
      en: Riconosci le prime lettere e usa saluti brevi ma utili.
    fiction:
      it: 'Al limitare del campo, una piccola scintilla si posa sul palmo dell’eroe. La scintilla non parla ancora: disegna lettere nell’aria. Ogni lettera accesa fa comparire una parola capace di aprire il primo sentiero.'
      en: 'Al limitare del campo, una piccola scintilla si posa sul palmo dell’eroe. La scintilla non parla ancora: disegna lettere nell’aria. Ogni lettera accesa fa comparire una parola capace di aprire il primo sentiero.'
    story_beats:
      - it: "Quando l'eroe ripete Բարև, la scintilla si divide in otto segni luminosi. Non sono ancora tutte le lettere: sono la prima squadra da riconoscere senza fretta."
        en: "When the hero repeats Բարև, the spark splits into eight glowing signs. They are not the whole alphabet yet: they are the first small team to recognise without rushing."
    lesson:
      title:
        it: Lettere e messaggi di una parola
        en: Lettere e messaggi di una parola
      objectives:
        - it: Riconoscere un primo gruppo di lettere armene.
          en: Riconoscere un primo gruppo di lettere armene.
        - it: Salutare, ringraziare e rispondere sì o no.
          en: Salutare, ringraziare e rispondere sì o no.
      explanation:
        it: "L’armeno ha un alfabeto proprio. Inizia osservando la forma delle lettere e collegandola al loro nome e al loro suono. Non serve impararle tutte insieme.\n\nAnche una sola parola può essere una frase completa: Բարև significa «Ciao», mentre Այո e Ոչ significano «Sì» e «No»."
        en: "L’armeno ha un alfabeto proprio. Inizia osservando la forma delle lettere e collegandola al loro nome e al loro suono. Non serve impararle tutte insieme.\n\nAnche una sola parola può essere una frase completa: Բարև significa «Ciao», mentre Այո e Ոչ significano «Sì» e «No»."
      examples:
        - target: Բարև։
          transliteration: barev
          translation:
            it: Ciao!
            en: Ciao!
        - target: Շնորհակալություն։
          transliteration: shnorhakalutyun
          translation:
            it: Grazie.
            en: Grazie.
        - target: Այո։ / Ոչ։
          transliteration: ayo / voch
          translation:
            it: Sì. / No.
            en: Sì. / No.
      dialogue:
        - speaker:
            it: "Scintilla"
            en: "Spark"
          target: "Բարև։"
          transliteration: "barev"
          translation:
            it: "Ciao!"
            en: "Hello!"
        - speaker:
            it: "Eroe"
            en: "Hero"
          target: "Բարև։"
          transliteration: "barev"
          translation:
            it: "Ciao!"
            en: "Hello!"
      study_notes:
        - it: "Distingui il nome della lettera dal suo suono: il pulsante del nome è disponibile, mentre il suono isolato richiede una registrazione verificata."
          en: "Distinguish a letter's name from its sound: the name button is available, while the isolated sound requires a verified recording."
        - it: "Usa l'Atlante dell'alfabeto per vedere tutte le lettere; quelle dei capitoli futuri restano consultabili ma sono marcate chiaramente."
          en: "Use the Alphabet Atlas to see every letter; future-chapter letters remain browsable but are clearly marked."
      common_mistakes:
        - it: 'Non cercare di leggere ogni lettera come se fosse latina: ascolta prima il modello armeno.'
          en: 'Non cercare di leggere ogni lettera come se fosse latina: ascolta prima il modello armeno.'
    mission:
      it: Accendi le prime rune pronunciando saluti e riconoscendo le lettere del capitolo.
      en: Accendi le prime rune pronunciando saluti e riconoscendo le lettere del capitolo.
    cliffhanger:
      it: "Oltre la prima porta, qualcuno ha cancellato tutti i nomi dal ponte."
      en: "Beyond the first gate, someone has erased every name from the bridge."
  - id: chapter_stage_1
    minimum_level: 1
    title:
      it: Capitolo 1 · Il guardiano dei nomi
      en: Chapter 1 · The guardian of names
    summary:
      it: Presentati, chiedi il nome e usa le forme più comuni del verbo essere.
      en: Presentati, chiedi il nome e usa le forme più comuni del verbo essere.
    fiction:
      it: Il primo ponte è sorvegliato da un guardiano che ha dimenticato tutti i nomi. Lascia passare soltanto chi sa dire chi è e sa chiedere con gentilezza il nome di un’altra persona.
      en: Il primo ponte è sorvegliato da un guardiano che ha dimenticato tutti i nomi. Lascia passare soltanto chi sa dire chi è e sa chiedere con gentilezza il nome di un’altra persona.
    story_beats:
      - it: "Il guardiano ascolta ogni sillaba e ricompone il proprio nome su una lastra di pietra. Una seconda voce, però, risponde dall'altra parte del ponte."
        en: "The guardian listens to every syllable and rebuilds his name on a stone tablet. But a second voice answers from the far side of the bridge."
    lesson:
      title:
        it: Presentarsi con il verbo essere
        en: Presentarsi con il verbo essere
      objectives:
        - it: Dire il proprio nome.
          en: Dire il proprio nome.
        - it: Chiedere il nome a un’altra persona.
          en: Chiedere il nome a un’altra persona.
        - it: Riconoscere եմ, ես ed է nelle frasi semplici.
          en: Riconoscere եմ, ես ed է nelle frasi semplici.
      explanation:
        it: "Nelle frasi armene più semplici, la forma del verbo «essere» arriva spesso alla fine. Ես significa «io» e եմ significa «sono».\n\nPer chiedere il nome si usa Ի՞նչ է քո անունը։, letteralmente «Qual è il tuo nome?». Nella traduzione italiana naturale diciamo «Come ti chiami?»."
        en: "Nelle frasi armene più semplici, la forma del verbo «essere» arriva spesso alla fine. Ես significa «io» e եմ significa «sono».\n\nPer chiedere il nome si usa Ի՞նչ է քո անունը։, letteralmente «Qual è il tuo nome?». Nella traduzione italiana naturale diciamo «Come ti chiami?»."
      examples:
        - target: Ես Անի եմ։
          transliteration: yes Ani em
          translation:
            it: Sono Ani.
            en: Sono Ani.
          note:
            it: եմ corrisponde a «sono».
            en: եմ corrisponde a «sono».
        - target: Ի՞նչ է քո անունը։
          transliteration: inch e qo anuny
          translation:
            it: Come ti chiami?
            en: Come ti chiami?
        - target: Իմ անունը Անի է։
          transliteration: im anuny Ani e
          translation:
            it: Mi chiamo Ani.
            en: Mi chiamo Ani.
          note:
            it: La traduzione letterale è «Il mio nome è Ani».
            en: La traduzione letterale è «Il mio nome è Ani».
      dialogue:
        - speaker:
            it: "Guardiano"
            en: "Guardian"
          target: "Ի՞նչ է քո անունը։"
          transliteration: "inch e qo anuny"
          translation:
            it: "Come ti chiami?"
            en: "What is your name?"
        - speaker:
            it: "Eroe"
            en: "Hero"
          target: "Ես Անի եմ։"
          transliteration: "yes Ani em"
          translation:
            it: "Sono Ani."
            en: "I am Ani."
      study_notes:
        - it: "Nelle frasi di presentazione, osserva la posizione finale di եմ o է prima di cercare una traduzione parola per parola."
          en: "In introduction sentences, notice the final position of եմ or է before attempting a word-for-word translation."
        - it: "Ripeti il dialogo cambiando solo il nome: la struttura resta stabile e diventa più facile da ricordare."
          en: "Repeat the dialogue while changing only the name: the structure stays stable and becomes easier to remember."
      common_mistakes:
        - it: 'Non tradurre sempre parola per parola: in italiano «Mi chiamo Ani» è più naturale di «Il mio nome è Ani».'
          en: 'Non tradurre sempre parola per parola: in italiano «Mi chiamo Ani» è più naturale di «Il mio nome è Ani».'
    mission:
      it: Di’ il tuo nome al guardiano e scopri come si chiama.
      en: Di’ il tuo nome al guardiano e scopri come si chiama.
    cliffhanger:
      it: "Il nome ritrovato apre una casa piena di fotografie senza etichette."
      en: "The recovered name opens a house filled with photographs whose labels are missing."
  - id: chapter_stage_2
    minimum_level: 2
    title:
      it: Capitolo 2 · La casa delle fotografie
      en: Chapter 2 · The house of photographs
    summary:
      it: Parla della famiglia, indica persone e cose, e usa mio/mia.
      en: Parla della famiglia, indica persone e cose, e usa mio/mia.
    fiction:
      it: In una casa illuminata dalla luna, le fotografie hanno perso le etichette. L’eroe deve riconoscere i membri della famiglia e restituire a ogni ritratto il nome giusto.
      en: In una casa illuminata dalla luna, le fotografie hanno perso le etichette. L’eroe deve riconoscere i membri della famiglia e restituire a ogni ritratto il nome giusto.
    story_beats:
      - it: "Ogni ritratto illuminato restituisce un ricordo al custode. L'ultima fotografia mostra una tavola apparecchiata, ma tutti i piatti sono vuoti."
        en: "Each illuminated portrait restores a memory to the caretaker. The last photograph shows a laid table, but every plate is empty."
    lesson:
      title:
        it: Questo è… e mio/mia
        en: Questo è… e mio/mia
      objectives:
        - it: Presentare una persona o una cosa vicina.
          en: Presentare una persona o una cosa vicina.
        - it: Usare իմ con i nomi della famiglia.
          en: Usare իմ con i nomi della famiglia.
        - it: Descrivere con un aggettivo semplice.
          en: Descrivere con un aggettivo semplice.
      explanation:
        it: "Սա significa «questo/questa» e introduce qualcosa di vicino. Իմ significa «mio/mia». L’articolo e il genere che usiamo in italiano dipendono dal nome, anche se l’armeno non li esprime nello stesso modo.\n\nNella frase Սա իմ մայրն է։, la forma է chiude la frase con il significato di «è»."
        en: "Սա significa «questo/questa» e introduce qualcosa di vicino. Իմ significa «mio/mia». L’articolo e il genere che usiamo in italiano dipendono dal nome, anche se l’armeno non li esprime nello stesso modo.\n\nNella frase Սա իմ մայրն է։, la forma է chiude la frase con il significato di «è»."
      examples:
        - target: Սա իմ մայրն է։
          transliteration: sa im mayrn e
          translation:
            it: Questa è mia madre.
            en: Questa è mia madre.
        - target: Սա իմ հայրն է։
          transliteration: sa im hayrn e
          translation:
            it: Questo è mio padre.
            en: Questo è mio padre.
        - target: Մեր տունը մեծ է։
          transliteration: mer tuny mets e
          translation:
            it: La nostra casa è grande.
            en: La nostra casa è grande.
      dialogue:
        - speaker:
            it: "Eroe"
            en: "Hero"
          target: "Սա իմ մայրն է։"
          transliteration: "sa im mayrn e"
          translation:
            it: "Questa è mia madre."
            en: "This is my mother."
        - speaker:
            it: "Custode"
            en: "Caretaker"
          target: "Սա իմ հայրն է։"
          transliteration: "sa im hayrn e"
          translation:
            it: "Questo è mio padre."
            en: "This is my father."
      study_notes:
        - it: "Սա introduce una persona o una cosa vicina. Իմ esprime il possesso senza cambiare per genere come mio/mia in italiano."
          en: "Սա introduces a nearby person or object. Իմ expresses possession without changing for gender as Italian mio/mia does."
        - it: "Confronta la frase armena con l'italiano naturale: il significato resta lo stesso anche quando l'ordine non coincide."
          en: "Compare the Armenian sentence with natural Italian: the meaning remains the same even when word order differs."
      common_mistakes:
        - it: In italiano scegli «questo» o «questa» in base al nome; non usare una forma doppia come «questo/questa».
          en: In italiano scegli «questo» o «questa» in base al nome; non usare una forma doppia come «questo/questa».
    mission:
      it: Rimetti in ordine le fotografie e presenta la famiglia al custode della casa.
      en: Rimetti in ordine le fotografie e presenta la famiglia al custode della casa.
    cliffhanger:
      it: "Dalla fotografia del banchetto arriva un rumore di bicchieri: il refettorio incantato si è svegliato."
      en: "A clink of glasses comes from the banquet photograph: the enchanted dining hall has awakened."
  - id: chapter_stage_3
    minimum_level: 3
    title:
      it: Capitolo 3 · Il banchetto silenzioso
      en: Chapter 3 · The silent banquet
    summary:
      it: Esprimi fame, sete e desideri; chiedi cibo e bevande con gentilezza.
      en: Esprimi fame, sete e desideri; chiedi cibo e bevande con gentilezza.
    fiction:
      it: Nel refettorio incantato il cibo appare soltanto quando qualcuno formula una richiesta chiara. Piatti e bicchieri restano vuoti finché l’eroe non impara a dire ciò che desidera.
      en: Nel refettorio incantato il cibo appare soltanto quando qualcuno formula una richiesta chiara. Piatti e bicchieri restano vuoti finché l’eroe non impara a dire ciò che desidera.
    story_beats:
      - it: "La prima richiesta corretta riempie un bicchiere; la seconda accende le candele. Sotto il piatto principale compare una chiave a forma di libro."
        en: "The first correct request fills a glass; the second lights the candles. Beneath the main plate appears a key shaped like a book."
    lesson:
      title:
        it: Dire ciò che vuoi e ciò di cui hai bisogno
        en: Dire ciò che vuoi e ciò di cui hai bisogno
      objectives:
        - it: Dire «Ho fame» e «Ho sete».
          en: Dire «Ho fame» e «Ho sete».
        - it: Usare ուզում եմ per esprimere un desiderio.
          en: Usare ուզում եմ per esprimere un desiderio.
        - it: Aggiungere «per favore» a una richiesta.
          en: Aggiungere «per favore» a una richiesta.
      explanation:
        it: "Ուզում եմ significa «voglio». L’oggetto desiderato viene espresso nella frase armena senza gli articoli italiani. In italiano, però, scegliamo la forma naturale: «del pane», «dell’acqua», «una mela», «della torta».\n\nԵս սոված եմ e Ես ծարավ եմ significano «Ho fame» e «Ho sete»."
        en: "Ուզում եմ significa «voglio». L’oggetto desiderato viene espresso nella frase armena senza gli articoli italiani. In italiano, però, scegliamo la forma naturale: «del pane», «dell’acqua», «una mela», «della torta».\n\nԵս սոված եմ e Ես ծարավ եմ significano «Ho fame» e «Ho sete»."
      examples:
        - target: Ես ջուր եմ ուզում։
          transliteration: yes jur em uzum
          translation:
            it: Voglio dell’acqua.
            en: Voglio dell’acqua.
        - target: Ես սոված եմ։
          transliteration: yes sovats em
          translation:
            it: Ho fame.
            en: Ho fame.
        - target: Խնդրում եմ։
          transliteration: khndrum em
          translation:
            it: Per favore.
            en: Per favore.
      dialogue:
        - speaker:
            it: "Eroe"
            en: "Hero"
          target: "Ես ջուր եմ ուզում։"
          transliteration: "yes jur em uzum"
          translation:
            it: "Voglio dell'acqua."
            en: "I want some water."
        - speaker:
            it: "Eroe"
            en: "Hero"
          target: "Խնդրում եմ։"
          transliteration: "khndrum em"
          translation:
            it: "Per favore."
            en: "Please."
      study_notes:
        - it: "Memorizza ուզում եմ come un blocco utile: prima scegli ciò che desideri, poi completa la richiesta."
          en: "Learn ուզում եմ as a useful chunk: first choose what you want, then complete the request."
        - it: "In italiano aggiungi l'articolo o la preposizione articolata necessaria; l'armeno non sempre mostra le stesse parole."
          en: "In Italian, add the article or partitive form needed; Armenian does not always show the same words."
      common_mistakes:
        - it: 'In italiano non dire «Voglio torta»: usa «Voglio una torta» oppure «Voglio della torta», secondo il significato.'
          en: 'In italiano non dire «Voglio torta»: usa «Voglio una torta» oppure «Voglio della torta», secondo il significato.'
    mission:
      it: Fai comparire il banchetto chiedendo correttamente ciò che serve agli ospiti.
      en: Fai comparire il banchetto chiedendo correttamente ciò che serve agli ospiti.
    cliffhanger:
      it: "La chiave-libro indica una scuola che cambia posizione ogni mattina."
      en: "The book-shaped key points to a school that changes position every morning."
  - id: chapter_stage_4
    minimum_level: 4
    title:
      it: Capitolo 4 · La scuola che si muove
      en: Chapter 4 · The moving school
    summary:
      it: Descrivi azioni quotidiane e usa frasi utili durante una lezione.
      en: Descrivi azioni quotidiane e usa frasi utili durante una lezione.
    fiction:
      it: 'La scuola del campo cambia posto ogni mattina. Per raggiungerla, l’eroe deve raccontare che cosa fa: va, legge, scrive, ascolta e chiede di ripetere quando qualcosa non è chiaro.'
      en: 'La scuola del campo cambia posto ogni mattina. Per raggiungerla, l’eroe deve raccontare che cosa fa: va, legge, scrive, ascolta e chiede di ripetere quando qualcosa non è chiaro.'
    story_beats:
      - it: "Quando l'eroe ammette di non capire, la scuola smette di correre. Chiedere di ripetere rivela una porta nascosta dietro la lavagna."
        en: "When the hero admits not understanding, the school stops running. Asking for repetition reveals a hidden door behind the board."
    lesson:
      title:
        it: Azioni al presente
        en: Azioni al presente
      objectives:
        - it: Parlare di azioni abituali o in corso.
          en: Parlare di azioni abituali o in corso.
        - it: Dire che vai a scuola, leggi, scrivi o ascolti.
          en: Dire che vai a scuola, leggi, scrivi o ascolti.
        - it: Chiedere aiuto quando non capisci.
          en: Chiedere aiuto quando non capisci.
      explanation:
        it: "Le forme del presente raccontano ciò che accade adesso o abitualmente. In molte frasi armene una forma di եմ accompagna il verbo principale.\n\nՉեմ հասկանում significa «Non capisco». Կրկնիր, խնդրում եմ significa «Ripeti, per favore». Sono frasi importanti da poter usare davvero durante lo studio."
        en: "Le forme del presente raccontano ciò che accade adesso o abitualmente. In molte frasi armene una forma di եմ accompagna il verbo principale.\n\nՉեմ հասկանում significa «Non capisco». Կրկնիր, խնդրում եմ significa «Ripeti, per favore». Sono frasi importanti da poter usare davvero durante lo studio."
      examples:
        - target: Ես դպրոց եմ գնում։
          transliteration: yes dprots em gnum
          translation:
            it: Vado a scuola.
            en: Vado a scuola.
        - target: Ես գիրք եմ կարդում։
          transliteration: yes girk em kardum
          translation:
            it: Leggo un libro.
            en: Leggo un libro.
        - target: Չեմ հասկանում։
          transliteration: chem haskanum
          translation:
            it: Non capisco.
            en: Non capisco.
      dialogue:
        - speaker:
            it: "Eroe"
            en: "Hero"
          target: "Չեմ հասկանում։"
          transliteration: "chem haskanum"
          translation:
            it: "Non capisco."
            en: "I do not understand."
        - speaker:
            it: "Eroe"
            en: "Hero"
          target: "Կրկնիր, խնդրում եմ։"
          transliteration: "krknir, khndrum em"
          translation:
            it: "Ripeti, per favore."
            en: "Repeat, please."
      study_notes:
        - it: "Le frasi per chiedere aiuto sono strumenti di studio: usale anche quando ascolti una registrazione o parli con una persona."
          en: "Phrases for asking for help are study tools: use them when listening to a recording or speaking with someone."
        - it: "Riconosci la parte negativa in չեմ prima di analizzare il resto del verbo."
          en: "Recognise the negative element in չեմ before analysing the rest of the verb."
      common_mistakes:
        - it: 'Non aggiungere sempre «sto» in italiano: spesso il presente semplice è la scelta più naturale.'
          en: 'Non aggiungere sempre «sto» in italiano: spesso il presente semplice è la scelta più naturale.'
    mission:
      it: Segui la scuola in movimento e completa le istruzioni della maestra.
      en: Segui la scuola in movimento e completa le istruzioni della maestra.
    cliffhanger:
      it: "Dietro la lavagna non c'è un corridoio, ma una mappa coperta di nebbia."
      en: "Behind the board there is no corridor, but a map covered in mist."
  - id: chapter_stage_5
    minimum_level: 5
    title:
      it: Capitolo 5 · La mappa nella nebbia
      en: Chapter 5 · The map in the mist
    summary:
      it: Chiedi dove si trova un luogo e distingui qui, lì e là.
      en: Chiedi dove si trova un luogo e distingui qui, lì e là.
    fiction:
      it: Una nebbia fitta ha cancellato i nomi dalla mappa. Le strade ricompaiono soltanto quando l’eroe sa chiedere dove si trova un posto e comprendere una risposta.
      en: Una nebbia fitta ha cancellato i nomi dalla mappa. Le strade ricompaiono soltanto quando l’eroe sa chiedere dove si trova un posto e comprendere una risposta.
    story_beats:
      - it: "Ogni risposta corretta asciuga una parte della mappa. Tra il parco e la scuola appare un sentiero che sale verso un orologio fatto di nuvole."
        en: "Each correct answer clears part of the map. Between the park and the school, a path appears leading up to a clock made of clouds."
    lesson:
      title:
        it: Dove? Qui e là
        en: Dove? Qui e là
      objectives:
        - it: Chiedere dove si trova un luogo.
          en: Chiedere dove si trova un luogo.
        - it: Comprendere այստեղ e այնտեղ.
          en: Comprendere այստեղ e այնտեղ.
        - it: Descrivere una posizione semplice.
          en: Descrivere una posizione semplice.
      explanation:
        it: "Որտե՞ղ significa «dove?». Այստեղ significa «qui», mentre այնտեղ significa «lì/là».\n\nIn italiano usiamo l’apostrofo in «Dov’è…?». Quando il luogo è già noto, l’articolo è naturale: «Dov’è la scuola?»."
        en: "Որտե՞ղ significa «dove?». Այստեղ significa «qui», mentre այնտեղ significa «lì/là».\n\nIn italiano usiamo l’apostrofo in «Dov’è…?». Quando il luogo è già noto, l’articolo è naturale: «Dov’è la scuola?»."
      examples:
        - target: Որտե՞ղ է դպրոցը։
          transliteration: vortegh e dprotsy
          translation:
            it: Dov’è la scuola?
            en: Dov’è la scuola?
        - target: Այգին այնտեղ է։
          transliteration: aygin ayntegh e
          translation:
            it: Il parco è là.
            en: Il parco è là.
        - target: Իմ ընկերը այստեղ է։
          transliteration: im ynkery aystegh e
          translation:
            it: Il mio amico è qui.
            en: Il mio amico è qui.
      dialogue:
        - speaker:
            it: "Eroe"
            en: "Hero"
          target: "Որտե՞ղ է դպրոցը։"
          transliteration: "vortegh e dprotsy"
          translation:
            it: "Dov'è la scuola?"
            en: "Where is the school?"
        - speaker:
            it: "Guida"
            en: "Guide"
          target: "Այգին այնտեղ է։"
          transliteration: "aygin ayntegh e"
          translation:
            it: "Il parco è là."
            en: "The park is over there."
      study_notes:
        - it: "Cerca prima la parola interrogativa Որտե՞ղ: segnala subito che la frase chiede una posizione."
          en: "Look for the question word Որտե՞ղ first: it immediately signals a location question."
        - it: "Allenati a distinguere այստեղ e այնտեղ insieme a un gesto reale verso un luogo vicino o lontano."
          en: "Practise distinguishing այստեղ and այնտեղ together with a real gesture toward a nearby or distant place."
      common_mistakes:
        - it: Scrivi «Dov’è» con l’apostrofo, non «Dove è».
          en: Scrivi «Dov’è» con l’apostrofo, non «Dove è».
    mission:
      it: Ricostruisci la mappa chiedendo la posizione dei luoghi nascosti.
      en: Ricostruisci la mappa chiedendo la posizione dei luoghi nascosti.
    cliffhanger:
      it: "La nebbia si ritira, ma le nuvole sopra il campo iniziano a contare alla rovescia."
      en: "The mist retreats, but the clouds above the camp begin counting down."
  - id: chapter_stage_6
    minimum_level: 6
    title:
      it: Capitolo 6 · L’orologio delle nuvole
      en: Chapter 6 · The cloud clock
    summary:
      it: Usa numeri, età, oggi e domani per orientarti nel tempo.
      en: Usa numeri, età, oggi e domani per orientarti nel tempo.
    fiction:
      it: 'Sopra il campo gira un orologio fatto di nuvole. Le sue lancette non indicano ore: mostrano numeri, età, giorni e cambiamenti del tempo.'
      en: 'Sopra il campo gira un orologio fatto di nuvole. Le sue lancette non indicano ore: mostrano numeri, età, giorni e cambiamenti del tempo.'
    story_beats:
      - it: "Ogni numero pronunciato rimette al proprio posto un ingranaggio. Quando l'eroe dice che giorno è, l'orologio mostra l'ingresso di un teatro buio."
        en: "Each spoken number returns a gear to its place. When the hero says what day it is, the clock reveals the entrance to a dark theatre."
    lesson:
      title:
        it: Numeri, età e parole del tempo
        en: Numeri, età e parole del tempo
      objectives:
        - it: Chiedere e dire l’età.
          en: Chiedere e dire l’età.
        - it: Usare oggi e domani.
          en: Usare oggi e domani.
        - it: Comprendere semplici frasi sul tempo atmosferico.
          en: Comprendere semplici frasi sul tempo atmosferico.
      explanation:
        it: "Քանի՞ տարեկան ես։ significa «Quanti anni hai?». Per rispondere puoi usare Ես ութ տարեկան եմ։, «Ho otto anni».\n\nԱյսօր significa «oggi» e վաղը significa «domani». Queste parole spesso vengono all’inizio della frase per chiarire quando avviene l’azione."
        en: "Քանի՞ տարեկան ես։ significa «Quanti anni hai?». Per rispondere puoi usare Ես ութ տարեկան եմ։, «Ho otto anni».\n\nԱյսօր significa «oggi» e վաղը significa «domani». Queste parole spesso vengono all’inizio della frase per chiarire quando avviene l’azione."
      examples:
        - target: Քանի՞ տարեկան ես։
          transliteration: kani tarekan es
          translation:
            it: Quanti anni hai?
            en: Quanti anni hai?
        - target: Ես ութ տարեկան եմ։
          transliteration: yes ut tarekan em
          translation:
            it: Ho otto anni.
            en: Ho otto anni.
        - target: Այսօր եղանակը լավ է։
          transliteration: aysor yeghanaky lav e
          translation:
            it: Oggi il tempo è bello.
            en: Oggi il tempo è bello.
      dialogue:
        - speaker:
            it: "Orologio"
            en: "Clock"
          target: "Քանի՞ տարեկան ես։"
          transliteration: "kani tarekan es"
          translation:
            it: "Quanti anni hai?"
            en: "How old are you?"
        - speaker:
            it: "Eroe"
            en: "Hero"
          target: "Ես ութ տարեկան եմ։"
          transliteration: "yes ut tarekan em"
          translation:
            it: "Ho otto anni."
            en: "I am eight years old."
      study_notes:
        - it: "Per l'età, l'armeno e l'italiano usano costruzioni diverse: impara l'intera risposta come un modello."
          en: "Armenian and Italian use different age constructions: learn the whole answer as a pattern."
        - it: "Metti oggi o domani all'inizio della frase quando vuoi rendere subito chiaro il momento."
          en: "Put today or tomorrow at the beginning when you want the time reference to be immediately clear."
      common_mistakes:
        - it: In italiano si dice «Ho otto anni», non «Sono otto anni».
          en: In italiano si dice «Ho otto anni», non «Sono otto anni».
    mission:
      it: Rimetti in moto l’orologio rispondendo alle domande su numeri, giorni e tempo.
      en: Rimetti in moto l’orologio rispondendo alle domande su numeri, giorni e tempo.
    cliffhanger:
      it: "Nel teatro, molte ombre provano a parlare insieme ma non riescono ancora a formare un coro."
      en: "In the theatre, many shadows try to speak together but cannot yet form a chorus."
  - id: chapter_stage_7
    minimum_level: 7
    title:
      it: Capitolo 7 · Il coro delle ombre
      en: Chapter 7 · The chorus of shadows
    summary:
      it: Parla di noi e loro, forma il plurale e costruisci frasi negative.
      en: Parla di noi e loro, forma il plurale e costruisci frasi negative.
    fiction:
      it: Nel teatro delle ombre nessuno può cantare da solo. Il coro si sveglia quando l’eroe sa parlare di più persone e sa dire anche ciò che non accade.
      en: Nel teatro delle ombre nessuno può cantare da solo. Il coro si sveglia quando l’eroe sa parlare di più persone e sa dire anche ciò che non accade.
    story_beats:
      - it: "Il coro cresce quando le voci passano da io a noi e da una persona a molte. Una nota stonata rivela il sentiero finale, nascosto dietro il sipario."
        en: "The chorus grows as voices move from I to we and from one person to many. One discordant note reveals the final path hidden behind the curtain."
    lesson:
      title:
        it: Noi, loro e la negazione
        en: Noi, loro e la negazione
      objectives:
        - it: Usare «noi» e «loro».
          en: Usare «noi» e «loro».
        - it: Riconoscere ենք ed են.
          en: Riconoscere ենք ed են.
        - it: Formare una frase negativa con չենք.
          en: Formare una frase negativa con չենք.
      explanation:
        it: "Մենք significa «noi» e նրանք significa «loro». Ենք ed են sono forme plurali del verbo «essere».\n\nLa forma չենք rende negativa una frase con «noi». In italiano i pronomi soggetto spesso si possono omettere: «Siamo amici» e «Non andiamo» sono più naturali di «Noi siamo amici» e «Noi non andiamo», salvo quando vuoi dare enfasi."
        en: "Մենք significa «noi» e նրանք significa «loro». Ենք ed են sono forme plurali del verbo «essere».\n\nLa forma չենք rende negativa una frase con «noi». In italiano i pronomi soggetto spesso si possono omettere: «Siamo amici» e «Non andiamo» sono più naturali di «Noi siamo amici» e «Noi non andiamo», salvo quando vuoi dare enfasi."
      examples:
        - target: Մենք ընկերներ ենք։
          transliteration: menk ynkerner enk
          translation:
            it: Siamo amici.
            en: Siamo amici.
        - target: Նրանք տանն են։
          transliteration: nrank tann en
          translation:
            it: Sono a casa.
            en: Sono a casa.
        - target: Մենք չենք գնում։
          transliteration: menk chenk gnum
          translation:
            it: Non andiamo.
            en: Non andiamo.
      dialogue:
        - speaker:
            it: "Coro"
            en: "Chorus"
          target: "Մենք ընկերներ ենք։"
          transliteration: "menk ynkerner enk"
          translation:
            it: "Siamo amici."
            en: "We are friends."
        - speaker:
            it: "Coro"
            en: "Chorus"
          target: "Մենք չենք գնում։"
          transliteration: "menk chenk gnum"
          translation:
            it: "Non andiamo."
            en: "We are not going."
      study_notes:
        - it: "Confronta ենք ed են: entrambe sono plurali, ma si riferiscono a persone grammaticali diverse."
          en: "Compare ենք and են: both are plural, but they refer to different grammatical persons."
        - it: "In italiano puoi spesso omettere noi o loro; conserva il pronome quando vuoi creare contrasto o enfasi."
          en: "In Italian you can often omit noi or loro; keep the pronoun when you want contrast or emphasis."
      common_mistakes:
        - it: 'Non tradurre automaticamente ogni pronome armeno: in italiano spesso il verbo basta.'
          en: 'Non tradurre automaticamente ogni pronome armeno: in italiano spesso il verbo basta.'
    mission:
      it: Fai cantare il coro componendo frasi al plurale e frasi negative.
      en: Fai cantare il coro componendo frasi al plurale e frasi negative.
    cliffhanger:
      it: "Dietro il sipario, le scintille diventano voci vere e pongono all'eroe una domanda dopo l'altra."
      en: "Behind the curtain, the sparks become real voices and ask the hero one question after another."
  - id: chapter_stage_8
    minimum_level: 8
    title:
      it: Capitolo 8 · Il sentiero delle voci
      en: Chapter 8 · The path of voices
    summary:
      it: Combina saluti, luoghi, tempo e azioni in brevi dialoghi.
      en: Combina saluti, luoghi, tempo e azioni in brevi dialoghi.
    fiction:
      it: Le scintille raccolte lungo il viaggio diventano voci. Per raggiungere la cima, l’eroe deve ascoltare un piccolo dialogo e rispondere usando tutto ciò che ha imparato.
      en: Le scintille raccolte lungo il viaggio diventano voci. Per raggiungere la cima, l’eroe deve ascoltare un piccolo dialogo e rispondere usando tutto ciò che ha imparato.
    story_beats:
      - it: "Le voci non chiedono una frase perfetta, ma uno scambio chiaro. Ogni risposta riaccende una parte del sentiero e richiama personaggi incontrati nei capitoli precedenti."
        en: "The voices do not demand a perfect sentence, only a clear exchange. Each answer relights part of the path and calls back characters from earlier chapters."
    lesson:
      title:
        it: Costruire un piccolo dialogo
        en: Costruire un piccolo dialogo
      objectives:
        - it: Collegare più frasi in uno scambio breve.
          en: Collegare più frasi in uno scambio breve.
        - it: Fare una domanda e rispondere.
          en: Fare una domanda e rispondere.
        - it: Riutilizzare parole dei capitoli precedenti.
          en: Riutilizzare parole dei capitoli precedenti.
      explanation:
        it: "Un dialogo semplice nasce da blocchi già conosciuti: saluto, presentazione, domanda, risposta e informazione su luogo o tempo.\n\nNon serve creare frasi lunghe. È meglio usare poche strutture chiare e corrette, ascoltando il ritmo dell’armeno."
        en: "Un dialogo semplice nasce da blocchi già conosciuti: saluto, presentazione, domanda, risposta e informazione su luogo o tempo.\n\nNon serve creare frasi lunghe. È meglio usare poche strutture chiare e corrette, ascoltando il ritmo dell’armeno."
      examples:
        - target: Բարև, ես Անի եմ։ Իսկ դու՞։
          transliteration: barev, yes Ani em. isk du
          translation:
            it: Ciao, sono Ani. E tu?
            en: Ciao, sono Ani. E tu?
        - target: Այսօր մենք դպրոց ենք գնում։
          transliteration: aysor menk dprots enk gnum
          translation:
            it: Oggi andiamo a scuola.
            en: Oggi andiamo a scuola.
        - target: Որտե՞ղ է դպրոցը։
          transliteration: vortegh e dprotsy
          translation:
            it: Dov’è la scuola?
            en: Dov’è la scuola?
      dialogue:
        - speaker:
            it: "Ani"
            en: "Ani"
          target: "Բարև, ես Անի եմ։ Իսկ դու՞։"
          transliteration: "barev, yes Ani em. isk du"
          translation:
            it: "Ciao, sono Ani. E tu?"
            en: "Hello, I am Ani. And you?"
        - speaker:
            it: "Compagno"
            en: "Companion"
          target: "Այսօր մենք դպրոց ենք գնում։"
          transliteration: "aysor menk dprots enk gnum"
          translation:
            it: "Oggi andiamo a scuola."
            en: "Today we are going to school."
      study_notes:
        - it: "Costruisci il dialogo con blocchi brevi: saluto, presentazione, domanda, risposta e una sola informazione aggiuntiva."
          en: "Build the dialogue from short blocks: greeting, introduction, question, answer, and one additional piece of information."
        - it: "Riascolta la risposta corretta dopo ogni esercizio e prova a ripeterla senza guardare la traslitterazione."
          en: "Listen to the correct answer after each exercise and try to repeat it without looking at the transliteration."
      common_mistakes:
        - it: In un dialogo italiano naturale evita di ripetere sempre «io», «noi» e «loro» quando il verbo è già chiaro.
          en: In un dialogo italiano naturale evita di ripetere sempre «io», «noi» e «loro» quando il verbo è già chiaro.
    mission:
      it: Completa il dialogo finale e apri il sentiero delle voci.
      en: Completa il dialogo finale e apri il sentiero delle voci.
    cliffhanger:
      it: "Il sentiero si apre, ma l'ultima scintilla rimane nel libro: attende nuove storie, nuovi dialoghi e una voce umana che li racconti."
      en: "The path opens, but the final spark remains in the book, waiting for new stories, new dialogues, and a human voice to tell them."

